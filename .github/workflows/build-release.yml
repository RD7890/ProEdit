name: Build ProEdit APK

on:
  push:
    branches: [ "main", "dev", "release/**" ]
    paths-ignore: [ '**.md' ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ProEdit APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. JDK 17 ─────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. NDK ────────────────────────────────────────────────────────────
      - name: Set up NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV

      # ── 4. Gradle cache ───────────────────────────────────────────────────
      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 5. Gradle wrapper ─────────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      # ── 6. Signing keystore ───────────────────────────────────────────────
      - name: Restore signing keystore
        run: |
          mkdir -p signing
          if [ -n "${{ secrets.SIGNING_KEYSTORE_B64 }}" ]; then
            echo "Using SIGNING_KEYSTORE_B64 secret"
            echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > signing/signing-key.jks
            echo "Keystore: $(wc -c < signing/signing-key.jks) bytes"
          else
            echo "Generating fresh keystore"
            keytool -genkeypair \
              -alias ProEdit -keypass ProEdit123 \
              -keystore signing/signing-key.jks \
              -storepass ProEdit123 \
              -dname "CN=ProEdit,OU=Dev,O=Rohan,L=India,S=India,C=IN" \
              -keyalg RSA -keysize 2048 -validity 10000 -noprompt
            echo "Generated: $(wc -c < signing/signing-key.jks) bytes"
          fi

      # ── 7. local.properties ───────────────────────────────────────────────
      - name: Create local.properties
        run: |
          printf 'signing.storeFile=signing/signing-key.jks\nsigning.storePassword=ProEdit123\nsigning.keyAlias=ProEdit\nsigning.keyPassword=ProEdit123\n' \
            > local.properties

      # ── 8. Auto version bump ──────────────────────────────────────────────
      - name: Bump version
        run: |
          BUILD=${{ github.run_number }}
          VER="1.0.${BUILD}"
          sed -i "s/versionCode = [0-9]*/versionCode = ${BUILD}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${VER}\"/" app/build.gradle.kts
          echo "versionCode  → ${BUILD}"
          echo "versionName  → ${VER}"

      # ── 9. Build Release APK ──────────────────────────────────────────────
      - name: Assemble Release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # ── 10. Version info ──────────────────────────────────────────────────
      - name: Get version
        id: version
        run: |
          VER=$(grep 'versionName' app/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"' | head -1)
          echo "name=$VER"            >> $GITHUB_OUTPUT
          echo "apk=ProEdit-v${VER}.apk" >> $GITHUB_OUTPUT
          echo "Version: $VER"

      # ── 11. Rename APK ────────────────────────────────────────────────────
      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "app/build/outputs/apk/release/${{ steps.version.outputs.apk }}"
          echo "APK size: $(du -sh "$APK" | awk '{print $1}')"

      # ── 12. Upload artifact ───────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk }}
          path: app/build/outputs/apk/release/ProEdit-*.apk
          retention-days: 30

      # ── 13. GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        if: >
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-build.${{ github.run_number }}
          name: "ProEdit v${{ steps.version.outputs.name }} (Build #${{ github.run_number }})"
          body: |
            ## ProEdit v${{ steps.version.outputs.name }} — Build #${{ github.run_number }}

            **Branch:** `${{ github.ref_name }}` | **Commit:** `${{ github.sha }}`
            **Package:** `com.rohan.proedit`

            ### What's included
            - NDK C++ image processing engine (adjustments, filters)
            - Manual brush masking with soft feather edges
            - Smart brush (color-similarity BFS flood fill)
            - Radial & linear gradient masks
            - Color range mask selection
            - Tune image: Brightness, Contrast, Saturation, Temperature, Highlights, Shadows, Sharpness, Ambiance
            - 8 preset filters: Vivid, Dramatic, B&W, Cinematic, Aqua, Matte, Golden
            - Photoshop-style dark UI

            ### Install
            Download APK → Enable "Install unknown apps" → Install

          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/ProEdit-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 14. On failure: upload log ────────────────────────────────────────
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log-${{ github.run_number }}
          path: build.log
          retention-days: 7
